[project]
name = "market-research-lab"
version = "0.1.0"
description = "A local-first workspace for market research."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5.5",
  "fastapi>=0.115,<1",
  "pandas>=3.0.5",
  "pyarrow>=25.0.0",
  "pydantic>=2.13.4",
  "python-multipart>=0.0.32",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project.scripts]
dev = "market_research_lab.commands:dev"
serve = "market_research_lab.commands:serve"
check = "market_research_lab.commands:check"
build = "market_research_lab.commands:build"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Legacy modules queued for cyclomatic complexity refactoring:
"src/market_research_lab/backtest.py" = ["C901"]
"src/market_research_lab/market_data.py" = ["C901"]
"src/market_research_lab/option_backtest.py" = ["C901"]
"src/market_research_lab/predictive_models.py" = ["C901"]
"src/market_research_lab/providers.py" = ["C901"]
"src/market_research_lab/reporting.py" = ["C901"]
"src/market_research_lab/routes/backtests.py" = ["C901"]
"src/market_research_lab/routes/deps.py" = ["C901"]
"src/market_research_lab/routes/valuations.py" = ["C901"]
"src/market_research_lab/strategies.py" = ["C901"]
"src/market_research_lab/valuation.py" = ["C901"]
