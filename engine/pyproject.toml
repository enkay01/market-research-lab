[project]
name = "market-research-lab"
version = "0.1.0"
description = "A local-first workspace for market research."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project.scripts]
market-research-lab-dev = "market_research_lab.commands:dev"
market-research-lab-serve = "market_research_lab.commands:serve"
market-research-lab-check = "market_research_lab.commands:check"
market-research-lab-build = "market_research_lab.commands:build"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
